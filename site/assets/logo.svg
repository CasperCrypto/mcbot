<svg xmlns="http://www.w3.org/2000/svg" x="0" y="0" class="food" data-food="burger" data-exp="idle" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="McBot" style="--food:var(--food-logo);--blink-delay:-2.646s"><title>McBot</title><style> :root { --ease: cubic-bezier(0.22, 1, 0.36, 1); --ease-spring: cubic-bezier(0.34, 1.45, 0.64, 1); --t-slow: 380ms; --food-1: #8b7bff; --food-2: #4f8cff; --food-3: #3ec3ff; --food-4: #2fd4b0; --food-5: #45cf6e; --food-6: #ffc23d; --food-7: #ff8a3d; --food-8: #ff5f5f; --food-9: #ff6fb1; --food-10: #c4865a; --food-logo: #9d9da6; --food-tint: #ffffff; --food-eye: #ffffff; --food-eye-edge: rgba(0, 0, 0, 0.26); --food-glass-hi: rgba(255, 255, 255, 0.5); --food-glass-mid: rgba(255, 255, 255, 0.03); --food-glass-lo: rgba(0, 0, 0, 0.34); --food-caustic: rgba(255, 255, 255, 0.32); --food-rim: rgba(255, 255, 255, 0.5); --food-shine: rgba(255, 255, 255, 0.85); --food-shade: rgba(0, 0, 0, 0.22); --food-shadow: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35)); --logo-glow: rgba(190, 190, 210, 0.22); } .food-face { display: inline-flex; flex: none; line-height: 0; } .food { display: block; flex: none; overflow: visible; filter: var(--food-shadow); } .food .base { fill: var(--food); } .food .light { fill: color-mix(in oklab, var(--food) 62%, var(--food-tint)); } .food .s-hi { stop-color: var(--food-glass-hi); } .food .s-mid { stop-color: var(--food-glass-mid); } .food .s-lo { stop-color: var(--food-glass-lo); } .food .g-in { stop-color: var(--food-caustic); } .food .g-out { stop-color: transparent; } .food .rim { fill: none; stroke: var(--food-rim); stroke-width: 1.8; } .food .shine { fill: none; stroke: var(--food-shine); stroke-width: 3; stroke-linecap: round; } .food .a-light { fill: color-mix(in oklab, var(--food) 55%, var(--food-tint)); } .food .a-dark { fill: var(--food-shade); } .food .a-white { fill: var(--food-eye); } .food .st { fill: none; stroke-linecap: round; stroke-linejoin: round; } .food .st.a-light { stroke: color-mix(in oklab, var(--food) 55%, var(--food-tint)); } .food .st.a-dark { stroke: var(--food-shade); } .food .st.a-white { stroke: var(--food-eye); } .food .eye { fill: var(--food-eye); stroke: var(--food-eye-edge); stroke-width: 1; paint-order: stroke; } .food .eye.arc { fill: none; stroke: var(--food-eye); stroke-width: 2.8; stroke-linecap: round; } .food .body { transform-box: view-box; transform-origin: 50% 90%; transition: transform var(--t-slow) var(--ease); } .food .lids { transform-box: fill-box; transform-origin: center; } .food[data-exp="idle"] .lids { animation: food-blink 5.6s var(--blink-delay, 0s) infinite; } .food[data-exp="thinking"] .lids { animation: food-look 2.6s ease-in-out infinite; } .food[data-exp="thinking"] .body { animation: food-bob 1.5s ease-in-out infinite; } .food[data-exp="happy"] .body { animation: food-hop 640ms var(--ease-spring) 1; } .food[data-exp="sad"] .body { transform: rotate(-5deg); } @keyframes food-blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(0.12); } } @keyframes food-look { 0%, 100% { transform: translateX(-1.6px); } 50% { transform: translateX(1.6px); } } @keyframes food-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } } @keyframes food-hop { 0% { transform: none; } 30% { transform: translateY(-5px) scale(0.96, 1.05); } 65% { transform: translateY(0) scale(1.05, 0.95); } 100% { transform: none; } } @media (prefers-reduced-motion: reduce) { .food .lids, .food .body { animation: none !important; transition: none; } }  .food .lids, .food .body { animation: none !important; } .food { filter: none; }</style><defs><linearGradient id="logo-s" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="60"><stop offset="0" class="s-hi"/><stop offset=".45" class="s-mid"/><stop offset="1" class="s-lo"/></linearGradient><radialGradient id="logo-g" gradientUnits="userSpaceOnUse" cx="32" cy="64" r="34"><stop offset="0" class="g-in"/><stop offset="1" class="g-out"/></radialGradient>