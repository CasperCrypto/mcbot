# Compiled by McBot from board "Acme ops" (acme-ops), agent node a2.
# McBot changes only the keys its board shows; other keys stay as you or Hermes set them.
model:
  provider: custom:mcbot-local
  default: "on"
providers:
  mcbot-local:
    api: http://127.0.0.1:1234/v1
    default_model: "on"
    transport: chat_completions
platform_toolsets:
  cli:
    - web
    - browser
    - file
    - image_gen
    - memory
  api_server:
    - web
    - browser
    - file
    - image_gen
    - memory
browser:
  headed: true
  engine: lightpanda
image_gen:
  provider: openrouter
platforms:
  telegram:
    extra:
      base_url: https://tg.example.com/bot
