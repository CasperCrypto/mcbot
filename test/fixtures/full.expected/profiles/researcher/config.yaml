# Compiled by McBot from board "Acme ops" (acme-ops), agent node a1.
# Recompiling overwrites this file: change the board, not this file.
model:
  provider: custom:mcbot-cloud
  default: frontier-1
providers:
  mcbot-cloud:
    api: https://api.example.com/v1
    key_env: EXAMPLE_API_KEY
    default_model: frontier-1
    transport: chat_completions
  mcbot-local:
    api: http://127.0.0.1:1234/v1
    default_model: "on"
    transport: chat_completions
fallback_providers:
  - provider: custom:mcbot-local
    model: "on"
mcp_servers:
  git:
    command: uvx
    args:
      - mcp-server-git
      - --repository
      - "yes"
    env:
      ALPHA: "0755"
      ZED: "1"
  search:
    url: https://mcp.example.com/mcp
    headers:
      Authorization: Bearer ${env:SEARCH_TOKEN}
      X-Team: ops
platform_toolsets:
  cli:
    - web
    - browser
    - file
    - terminal
    - code_execution
    - vision
    - image_gen
    - video_gen
    - tts
    - memory
    - session_search
    - skills
    - todo
    - clarify
    - delegation
    - cronjob
    - computer_use
    - connections
video_gen:
  provider: fal
  model: kling-video
