# Every pull request and every push to the default branch: the tests, the typecheck,
# the desktop UI build and the browser demo build. Real-Hermes tests skip themselves
# here (no prepared engine); run them locally with MCBOT_E2E=1 npm test.
#
# Pull requests from forks run with a read-only token and no secrets (`pull_request`, never
# `pull_request_target`); test/supply-chain.test.ts keeps it that way.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Typecheck and UI build
        run: npm run build
      - name: Browser demo build
        run: npm run build:demo

  # Windows: the builds must pass (npm run build:demo broke there once and nobody saw). Some tests
  # still assume POSIX paths and signals; they report here without blocking until they are fixed.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and UI build
        run: npm run build
      - name: Browser demo build
        run: npm run build:demo
      - name: Tests (not blocking yet)
        continue-on-error: true
        run: npm test

  # A pull request that adds or bumps a dependency with a known high or critical advisory fails
  # here, before anyone merges it (GitHub's advisory database: npm, crates and Actions).
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
