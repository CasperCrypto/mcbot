# The website (site/) with the browser demo at /demo/, published to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: GitHub Actions.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "engine/cost.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      - name: Assemble
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R dist-demo _site/demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
