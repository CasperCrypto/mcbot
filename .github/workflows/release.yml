# Installers for macOS (Apple silicon and Intel), Windows and Linux, attached to a draft
# GitHub release. Push a tag like v0.1.0 (or run it by hand), check the draft, publish it:
# the website's download buttons pick up the newest published release.
#
# Unsigned on purpose (free and open source): macOS asks once (System Settings → Privacy &
# Security → Open Anyway), Windows SmartScreen asks once (More info → Run anyway).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Intel Macs build on the same Apple silicon runner, after the arm64 build: a second
        # macOS job waits for a free Mac runner and was cancelled in the queue twice.
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            also: x86_64-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # tauri build runs beforeBuildCommand: the UI, the engine for this target, and the Hermes it ships.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: v__VERSION__
          releaseName: McBot v__VERSION__
          releaseBody: |
            McBot v__VERSION__. Download the file for your computer below.
            First launch prepares Hermes (a few minutes, needs internet).
            Not signed yet: on macOS open it once, then System Settings → Privacy & Security → Open Anyway; on Windows choose More info → Run anyway.
          releaseDraft: true
          prerelease: false
      - name: Intel Mac build
        if: matrix.also
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.also }}
          tagName: v__VERSION__
          releaseName: McBot v__VERSION__
          releaseBody: |
            McBot v__VERSION__. Download the file for your computer below.
            First launch prepares Hermes (a few minutes, needs internet).
            Not signed yet: on macOS open it once, then System Settings → Privacy & Security → Open Anyway; on Windows choose More info → Run anyway.
          releaseDraft: true
          prerelease: false
