# CodeQL: GitHub's code scanning for McBot's TypeScript (app, engine, scripts, site) and its
# workflows, on every pull request, on the default branch and once a week. hermes/ (upstream's
# Python) is left to upstream's own scanning. Findings appear in the repository's Security tab.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - hermes
              - node_modules
              - dist
              - dist-demo
              - test/fixtures
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
