# Weekly dependency updates, grouped so they arrive as a few pull requests. hermes/ is not listed:
# the engine follows upstream Hermes releases through hermes-sync.yml instead.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tauri stays on 2.x (CLAUDE.md: never 3 while it is alpha).
      - dependency-name: "@tauri-apps/*"
        update-types: [version-update:semver-major]
      # React Flow 13 changes the board's API (changesets, no applyNodeChanges/useStore): a migration
      # done on purpose, not a bump (CasperCrypto/mcbot#66).
      - dependency-name: "@xyflow/react"
        update-types: [version-update:semver-major]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "tauri*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
