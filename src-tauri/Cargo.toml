[package]
name = "mcbot"
version = "0.1.0"
description = "McBot — draw a harness of AI agents and compile it into a runnable Hermes Agent setup"
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "mcbot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Tauri 2.x only. Caret ranges never match a 3.0.0 pre-release.
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
